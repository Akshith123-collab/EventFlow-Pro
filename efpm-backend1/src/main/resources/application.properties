spring.application.name=efpm-backend1
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/efpm_db}

# File upload path
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}

# Mail (configure with environment variables in production)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
